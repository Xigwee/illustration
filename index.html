<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二次元插画 · 段位评定</title>
<style>
:root {
  --bg: #060a10; --panel: #0a121a; --border: #1a2c3a;
  --text: #b9cddb; --dim: #5a7a8a; --accent: #7cd8ff;
  --success: #4be0c0; --warning: #e0a63c; --danger: #f87171;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}

/* ═══ 顶栏 ═══ */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 60px;
  background: linear-gradient(180deg, #0d1822, #080d14);
  border-bottom: 1px solid var(--border); z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.header-title {
  font-size: 16px; letter-spacing: 3px; color: #dfeef8;
  text-shadow: 0 0 10px rgba(90, 200, 255, 0.4);
}
.header-title span { font-size: 10px; color: #4a7a9a; letter-spacing: 1px; border-left: 1px solid var(--border); padding-left: 12px; }

/* 作者与制作信息 */
.author-info { display: flex; align-items: center; gap: 10px; font-size: 11px; margin-left: 10px; }
.author-link {
  color: #f472b6; text-decoration: none; display: flex; align-items: center; gap: 4px;
  background: rgba(244, 114, 182, 0.1); padding: 4px 10px; border-radius: 12px;
  border: 1px solid rgba(244, 114, 182, 0.3); transition: 0.2s;
}
.author-link:hover { background: rgba(244, 114, 182, 0.2); box-shadow: 0 0 10px rgba(244,114,182,0.3); }
.ai-tag { color: var(--dim); font-style: italic; }

/* 全局综合段位显示 */
.rank-display {
  display: flex; align-items: center; gap: 10px;
  background: rgba(224, 166, 60, 0.1); border: 1px solid rgba(224, 166, 60, 0.4);
  padding: 4px 16px; border-radius: 20px; cursor: pointer; transition: 0.2s;
}
.rank-display:hover { background: rgba(224, 166, 60, 0.2); box-shadow: 0 0 15px rgba(224,166,60,0.2); }
.rank-display .r-icon { font-size: 16px; }
.rank-display .r-text { font-size: 14px; font-weight: bold; color: var(--warning); letter-spacing: 1px; }

.actions button {
  background: rgba(20, 45, 65, 0.6); border: 1px solid #2a4c64; color: #8fc8e6;
  padding: 8px 16px; font-size: 12px; cursor: pointer; transition: 0.2s;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  margin-left: 10px;
}
.actions button:hover { background: rgba(30, 70, 100, 0.8); color: #dff5ff; border-color: #4a9cc4; }
.actions button.primary { background: linear-gradient(90deg, #1f6485, #3898c4); color: #fff; border: none; }
.actions button.primary:hover { filter: brightness(1.2); }

/* ═══ 主布局 ═══ */
.main { display: flex; flex: 1; min-height: 0; }

/* 左侧导航 */
.sidebar {
  width: 84px; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; padding-top: 12px; z-index: 5;
}
.nav-item {
  width: 64px; height: 72px; margin-bottom: 6px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer; border: 1px solid transparent;
  transition: 0.2s; color: var(--dim); border-radius: 2px;
}
.nav-item:hover { background: #122030; color: #9fc0d0; }
.nav-item.active { background: #14283a; border-color: #2a5c8a; color: var(--accent); box-shadow: inset 0 0 10px rgba(40, 120, 200, 0.2); }
.nav-icon { font-size: 24px; margin-bottom: 4px; }
.nav-name { font-size: 11px; letter-spacing: 1px; }

/* 树区域 */
.tree-wrapper {
  flex: 1; overflow: auto; position: relative;
  background-image: 
    radial-gradient(circle at 50% 50%, rgba(20, 40, 60, 0.4), transparent 80%),
    linear-gradient(rgba(40, 80, 120, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(40, 80, 120, 0.05) 1px, transparent 1px);
  background-size: 100% 100%, 40px 40px, 40px 40px;
}
.tree-container { position: relative; width: 1100px; height: 1750px; margin: 30px; }
svg.links { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
svg.links path { fill: none; stroke-width: 2; transition: stroke 0.3s; }
svg.links path.locked { stroke: #1a2c3a; }
svg.links path.open { stroke: #4a7a9a; stroke-dasharray: 4 4; }
svg.links path.active { stroke: var(--success); filter: drop-shadow(0 0 4px rgba(75, 224, 192, 0.5)); }

/* 节点 */
.node {
  position: absolute; width: 130px; height: 56px; background: #0d1822; border: 1px solid #1e3a4c;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: all 0.2s; user-select: none; z-index: 2; padding: 0 8px;
}
.node::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: #1e3a4c; transition: background 0.3s; }
.node.locked { opacity: 0.4; filter: grayscale(1); }
.node.available { border-color: var(--warning); animation: pulse 2s infinite; }
.node.available::before { background: var(--warning); }
.node.unlocked { border-color: var(--success); background: #0f1e24; box-shadow: 0 0 15px rgba(75, 224, 192, 0.15); }
.node.unlocked::before { background: var(--success); }
.node.selected { box-shadow: 0 0 20px rgba(120, 200, 255, 0.6); border-color: var(--accent) !important; z-index: 3; }
.node:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6); }
.node-name { font-size: 11px; color: #c0d8e8; text-align: center; line-height: 1.3; font-weight: bold; }
.node-rank { font-size: 9px; color: #5a8a9a; margin-top: 2px; }
.node.unlocked .node-rank { color: var(--success); }
.node.available .node-rank { color: var(--warning); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 5px rgba(224, 166, 60, 0.2); } 50% { box-shadow: 0 0 15px rgba(224, 166, 60, 0.6); } }

/* 右侧详情 */
.detail {
  width: 340px; background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 5;
}
.detail-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.detail-header h2 { font-size: 15px; color: #dfeef8; font-weight: normal; }
.detail-content { flex: 1; overflow-y: auto; padding: 20px; }
.info-group { margin-bottom: 20px; }
.info-label { font-size: 11px; color: #4a7a9a; letter-spacing: 1px; margin-bottom: 8px; border-bottom: 1px dashed #1a2c3a; padding-bottom: 4px; }
.info-value { font-size: 13px; color: #b0c8d8; line-height: 1.6; }
.explain-box { background: rgba(30, 60, 85, 0.2); padding: 10px; border-left: 2px solid var(--accent); border-radius: 0 4px 4px 0; font-style: italic; color: #a8c0d0; font-size: 12.5px; line-height: 1.7; }
.rank-badge { display: inline-block; font-size: 18px; color: var(--warning); font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 10px rgba(224,166,60,0.3); }
.rank-badge.unlocked { color: var(--success); text-shadow: 0 0 10px rgba(75,224,192,0.3); }

/* 分支总览列表 */
.b-list { margin-top: 10px; }
.b-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: rgba(20, 40, 60, 0.3); border: 1px solid #1a2c3a; margin-bottom: 6px; border-radius: 2px; cursor: pointer; transition: 0.2s; }
.b-item:hover { background: rgba(40, 70, 100, 0.5); border-color: #2a5c8a; }
.b-item.unlocked { border-left: 2px solid var(--success); }
.b-item.locked { opacity: 0.6; }
.b-item-name { font-size: 12px; color: #c0d8e8; }
.b-item-rank { font-size: 11px; color: var(--dim); }
.b-item.unlocked .b-item-rank { color: var(--success); }

/* 全局段位面板 */
.overall-panel {
  background: linear-gradient(180deg, rgba(30, 40, 50, 0.4), rgba(10, 18, 26, 0.8));
  border: 1px solid #2a4c64; border-radius: 4px; padding: 16px; margin-bottom: 20px;
  box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
}
.overall-title { font-size: 12px; color: var(--warning); letter-spacing: 2px; margin-bottom: 8px; text-align: center; }
.overall-rank { font-size: 26px; color: #fff; font-weight: bold; text-align: center; margin-bottom: 12px; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
.overall-comment { font-size: 13px; color: #b0c8d8; line-height: 1.8; text-align: justify; }
.overall-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.o-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(75, 224, 192, 0.1); border: 1px solid var(--success); color: var(--success); }
.o-tag.warn { background: rgba(248, 113, 113, 0.1); border-color: var(--danger); color: var(--danger); }

/* 升段条件框 */
.next-goal-box { background: rgba(40, 80, 120, 0.15); border: 1px dashed #2a5c8a; padding: 12px; border-radius: 4px; margin-bottom: 20px; }
.next-goal-box.beyond { border-color: var(--warning); background: rgba(224, 166, 60, 0.1); }
.goal-title { font-size: 12px; color: var(--accent); margin-bottom: 6px; }
.next-goal-box.beyond .goal-title { color: var(--warning); }
.goal-desc { font-size: 12px; color: #a8c0d0; line-height: 1.6; }

.btn { width: 100%; padding: 12px; font-size: 13px; letter-spacing: 1px; cursor: pointer; margin-top: 10px; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: 0.2s; }
.btn-primary { background: linear-gradient(90deg, #1f6485, #3898c4); border: none; color: #fff; }
.btn-primary:hover { filter: brightness(1.2); }
.btn-primary:disabled { background: #1a2c3a; color: #4a6a7a; cursor: not-allowed; filter: none; }
.btn-outline { background: transparent; border: 1px solid #2a5c8a; color: var(--accent); }
.btn-outline:hover { background: rgba(42, 92, 138, 0.2); border-color: #4a9cc4; }
.disclaimer-text { font-size: 11px; color: #4a6a7a; line-height: 1.5; margin-top: 15px; text-align: center; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--panel); }
::-webkit-scrollbar-thumb { background: #1e3a4c; border-radius: 3px; }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="header-title">
      二次元插画 · 科技树
      <span>娱乐向评定 v1</span>
    </div>
    <div class="author-info">
      <a href="https://space.bilibili.com/2018318845" target="_blank" class="author-link">B站 且补天裂</a>
      <span class="ai-tag">技术支持：DeepSeek</span>
    </div>
    <div class="rank-display" id="headerRank" onclick="showOverall()">
      <div class="r-icon">🌱</div>
      <div class="r-text" id="headerRankText">未入门</div>
    </div>
  </div>
  <div class="actions">
    <button id="resetBtn">清空进度</button>
    <button id="exportBtn" class="primary">导出全景评级图</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar"></aside>
  
  <div class="tree-wrapper" id="treeWrapper">
    <div class="tree-container" id="treeContainer">
      <svg class="links" id="svg"></svg>
      <div id="nodesLayer"></div>
    </div>
  </div>

  <aside class="detail">
    <div class="detail-header">
      <h2 id="detailTitle">综合评定档案</h2>
    </div>
    <div class="detail-content" id="detailContent"></div>
  </aside>
</div>

<script>
/* ═══════════ 基础配置 ═══════════ */
const BRANCHES = {
  T: { name: '基础系统', icon: '📐', color: '#38bdf8' },
  H: { name: '头面系统', icon: '👤', color: '#22d3ee' },
  B: { name: '躯干系统', icon: '👕', color: '#60a5fa' },
  L: { name: '四肢系统', icon: '🦵', color: '#c084fc' },
  G: { name: '场景系统', icon: '🏙️', color: '#fb7185' },
  S: { name: '色彩系统', icon: '🎨', color: '#facc15' },
  I: { name: '整合系统', icon: '🖼️', color: '#34d399' }
};
const TIER_LABEL = { 1: '一代', 2: '二代', 3: '三代', 4: '四代' };
const NW = 130, NH = 56;

/* ═══════════ 打磨后的段位标准 ═══════════ */
const RANKS = [
  { level: '未入门', title: '未入门 · 观光客', icon: '👀', color: '#4a6a7a',
    desc: '当前尚未点亮任何基础节点。可能你还在观望，或者只是单纯点进来看看大肥鱼搞了什么花活。建议从【基础系统】的线条与透视开始探索。',
    tag_ok: ['零基础'], tag_warn: ['还没开始'],
    criteria: '点亮基础系统(T)的任意一个节点。',
    check: () => unlocked.size > 0 },

  { level: '一段', title: '一段 · 萌新画手', icon: '🌱', color: '#94a3b8',
    desc: '【次元入门期】刚接触板绘或二次元临摹。线条抖动、闭塞线未处理，人体像“火柴人”，透视完全凭直觉。上色多为纯色平铺，体积感不足。需立刻建立正确的观察与线条发力习惯。',
    tag_ok: ['热爱二次元'], tag_warn: ['线稿碎', '人体崩坏'],
    criteria: '点亮基础系统(T)的所有一代节点。', 
    check: () => unlocked.has('T1') && unlocked.has('T2') && unlocked.has('T3') },
    
  { level: '二段', title: '二段 · 形体画手', icon: '📐', color: '#38bdf8',
    desc: '【结构觉醒期】能画出完整的二次元头像，但身体比例失调（如大头小身、面条手），头发像一块铁板。明白了赛璐璐的概念，但明暗交界线画得像狗啃。临摹神仙图尚可，一原创就崩。',
    tag_ok: ['线条流畅'], tag_warn: ['纸片人', '比例失调'],
    criteria: '点亮头面、躯干、四肢分支的基础体块节点（H1、B1、L1）。',
    check: () => unlocked.has('H1') && unlocked.has('B1') && unlocked.has('L1') },

  { level: '三段', title: '三段 · 技法画手', icon: '🧱', color: '#60a5fa',
    desc: '【线稿修行期】线稿有了粗细变化，能画出干净的赛璐璐平涂。拥有构图意识，会加些二次元常见的小装饰（如星星、飘带）。但人物动态生硬，不懂找参考，缺乏对二次元夸张结构的底层理解。',
    tag_ok: ['干净的平涂'], tag_warn: ['动态僵硬', '依赖临摹'],
    criteria: '点亮“动态线动作(L8)”或“五官落位(H3)”，掌握基础的二次元变体。',
    check: () => unlocked.has('L8') || unlocked.has('H3') },

  { level: '四段', title: '四段 · 破局画手', icon: '💡', color: '#a78bfa',
    desc: '【瓶颈突破期】能画出完成度极高的二次元立绘，发丝分组、褶皱走向都有模有样，伪厚涂/赛璐璐切换自如。但画复杂透视（如俯仰、大透视手部）容易崩，画风不统一。达到此段，已具备接普通商单或做游戏原画外包的能力。',
    tag_ok: ['高完成度', '材质区分'], tag_warn: ['透视易崩', '画风摇摆'],
    criteria: '点亮任意一个三代核心结构（如H12头部透视、B9厚衣体积、L9手脚透视），且色彩达到二代。',
    check: () => (unlocked.has('H12') || unlocked.has('B9') || unlocked.has('L9')) && unlocked.has('S5') },

  { level: '五段', title: '五段 · 职业画师', icon: '🛡️', color: '#fbbf24',
    desc: '【专业独立期】圈子里的“太太”。画风稳定，商单不断，能完美驾驭各种二次元萌点（机甲、兽耳、异世界）。此时画技已非最大壁垒，核心在于建立个人IP与不可替代的风格。许多人会转岗主美、导演，强项变为“审美把控”与“项目管理”。',
    tag_ok: ['独当一面', '接单自由'], tag_warn: ['需塑品牌'],
    criteria: '打通整合系统，解锁“全身插画(I4)”或“商单工业化(I6)”，且色彩、背景系统均达到三代。',
    check: () => (unlocked.has('I4') || unlocked.has('I6')) && unlocked.has('S7') && unlocked.has('G8') },

  { level: '六段', title: '六段 · 顶流画师', icon: '👑', color: '#f59e0b',
    desc: '【个人品牌期】科技树的终点。画风即是金字招牌，发张草图都能上万赞，独立画集销量惊人。技法上已无死角，剩下的路，是建立极强的“表达力”、跨领域的常识积累，以及对整个二次元圈层审美的引领。',
    tag_ok: ['自带流量', '一稿难求'], tag_warn: ['需扩常识'],
    criteria: '点亮全树 100% 节点（点满所有科技）。',
    check: () => unlocked.size === NODES.length },

  { level: '七段', title: '七段 · 宗师', icon: '🔥', color: '#f87171', isBeyond: true,
    desc: '【业界标杆】不仅是你个人的胜利，更是对二次元行业有深远影响的人物。可能是某款现象级二次元游戏的美术主美，或是某种新风潮（如“厚涂风”或“设计流”）的开创者。你的名字在圈内就是品质保证。',
    tag_ok: ['行业顶端'], tag_warn: ['跨越时代'],
    criteria: '此为隐藏境界。需在现实中拥有极强的业界口碑与稳定高净值受众。',
    check: () => false },

  { level: '八段', title: '八段 · 殿堂传奇', icon: '🌟', color: '#fff', isBeyond: true,
    desc: '【时代印记】在二次元艺术史上留下浓墨重彩的一笔。定义了一种审美范式，其作品被无数后来者顶礼膜拜与模仿。这已无关技法，而是天赋、机遇与时代共振的结果。',
    tag_ok: ['封神'], tag_warn: ['不可复制'],
    criteria: '此为隐藏境界。超越科技树，属于历史成就。',
    check: () => false }
];

/* ═══════════ 66 个节点数据（略，保持你之前的原样即可） ═══════════ */
const NODES = [
  { id:'T1', b:'T', tier:1, name:'观察与测量', x:40, y:800, rank:'一代·入门', prereq:[], content:'目测比例 · 笔杆测量 · 正负形观察', explain:'先看大形再看细节，是避免画崩的根本习惯。用铅笔竖在眼前比对比例，或用负形检查轮廓。', output:'能临摹简单静物，比例误差小' },
  { id:'T2', b:'T', tier:1, name:'线条控制', x:40, y:875, rank:'一代·入门', prereq:[], content:'长线练习 · 轻重变化 · 收笔接线', explain:'二次元插画高度依赖线稿。练习从肩部发力画长线，而不是用手腕蹭短线。线条要有粗细变化。', output:'能一笔画出流畅长曲线' },

let unlocked = new Set();
const savedData = localStorage.getItem('illustration_tree_progress');
if (savedData) {
  try {
    const arr = JSON.parse(savedData);
    unlocked = new Set(arr);
  } catch (e) { console.error('缓存解析失败'); }
}

let currentView = 'overall'; 
let selectedId = null;

function saveProgress() {
  localStorage.setItem('illustration_tree_progress', JSON.stringify(Array.from(unlocked)));
}

function stateOf(n) {
  if (unlocked.has(n.id)) return 'unlocked';
  if (n.prereq.every(p => unlocked.has(p))) return 'available';
  return 'locked';
}

function getOrthogonalPath(a, b) {
  const ax = a.x + NW; const ay = a.y + NH/2;
  const bx = b.x; const by = b.y + NH/2;
  if (bx <= ax) {
    const offsetX = a.x - 30; 
    return `M ${ax} ${ay} L ${offsetX} ${ay} L ${offsetX} ${by} L ${bx} ${by}`;
  }
  const midX = ax + (bx - ax) / 2;
  return `M ${ax} ${ay} L ${midX} ${ay} L ${midX} ${by} L ${bx} ${by}`;
}

function getBranchMaxRank(bCode) {
  const bNodes = NODES.filter(n => n.b === bCode);
  let maxTier = 0;
  let total = bNodes.length;
  let unlockedCount = 0;
  bNodes.forEach(n => {
    if (unlocked.has(n.id)) {
      unlockedCount++;
      if (n.tier > maxTier) maxTier = n.tier;
    }
  });
  if (maxTier === 0) return '未入门';
  if (unlockedCount === total) return TIER_LABEL[maxTier] + '·精通';
  return TIER_LABEL[maxTier] + '·入门';
}

function getOverallRankIndex() {
  let idx = 0;
  for (let i = 0; i < RANKS.length; i++) {
    if (RANKS[i].check()) {
      idx = i;
    } else {
      break;
    }
  }
  return idx;
}

function hexToRgb(hex) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  return `${r}, ${g}, ${b}`;
}

/* ═══════════ Canvas 工具 ═══════════ */
function drawTechFrame(ctx, x, y, w, h, c=1, bg='#0a121a', border='#1a2c3a') {
  const cut = 12 * c;
  ctx.beginPath();
  ctx.moveTo(x + cut, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h - cut);
  ctx.lineTo(x + w - cut, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + cut);
  ctx.closePath();
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = border; ctx.lineWidth = 1.5 * c; ctx.stroke();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  let words = text.split('');
  let line = '';
  for(let n = 0; n < words.length; n++) {
    let testLine = line + words[n];
    let metrics = ctx.measureText(testLine);
    let testWidth = metrics.width;
    if (testWidth > maxWidth && n > 0) {
      ctx.fillText(line, x, y);
      line = words[n];
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, y);
  return y + lineHeight;
}

/* ═══════════ 生成分类评定卡 ═══════════ */
function generateBranchCard(bCode) {
  const b = BRANCHES[bCode];
  const bNodes = NODES.filter(n => n.b === bCode);
  const rank = getBranchMaxRank(bCode);
  const unlockedCount = bNodes.filter(n => unlocked.has(n.id)).length;

  const canvas = document.createElement('canvas');
  
  const cols = 2;
  const rows = Math.ceil(bNodes.length / cols);
  const W = 900, H = 380 + rows * 46 + 60; // 增加高度容纳免责声明
  
  canvas.width = W * 2; canvas.height = H * 2;
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);

  ctx.fillStyle = '#04070c'; ctx.fillRect(0, 0, W, H);
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  grad.addColorStop(0, 'rgba(20, 50, 80, 0.4)'); grad.addColorStop(1, 'rgba(4, 7, 12, 0)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(40, 80, 120, 0.1)'; ctx.lineWidth = 1;
  for(let i=0; i<W; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
  for(let i=0; i<H; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }

  drawTechFrame(ctx, 30, 30, W - 60, H - 60, 1.5, '#0a121a', b.color);
  ctx.fillStyle = b.color; ctx.fillRect(45, 30, 180, 4);

  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = b.color; ctx.font = 'bold 18px "PingFang SC", sans-serif';
  ctx.fillText(`${b.name}`, 50, 60);

  ctx.fillStyle = '#dfeef8'; ctx.font = 'bold 32px "PingFang SC", sans-serif';
  ctx.fillText('系统综合评定卡', 50, 90);

  ctx.fillStyle = unlockedCount > 0 ? 'rgba(75, 224, 192, 0.15)' : 'rgba(224, 166, 60, 0.15)';
  ctx.fillRect(50, 145, 200, 40);
  ctx.strokeStyle = unlockedCount > 0 ? '#4be0c0' : '#e0a63c';
  ctx.lineWidth = 1; ctx.strokeRect(50, 145, 200, 40);
  ctx.fillStyle = unlockedCount > 0 ? '#4be0c0' : '#e0a63c';
  ctx.font = 'bold 22px "PingFang SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(rank, 150, 165);

  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(110, 175, 215, 0.8)'; ctx.font = '14px "PingFang SC", sans-serif';
  ctx.fillText(`进度: ${unlockedCount} / ${bNodes.length} 节点`, W - 50, 80);

  ctx.strokeStyle = '#1a2c3a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(50, 210); ctx.lineTo(W - 50, 210); ctx.stroke();

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const startY = 230;
  const colW = (W - 100) / 2 - 10;

  bNodes.forEach((n, i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const nx = 50 + col * (colW + 20);
    const ny = startY + row * 46;
    const isUnlocked = unlocked.has(n.id);

    drawTechFrame(ctx, nx, ny, colW, 36, 1, 'rgba(10, 18, 26, 0.6)', isUnlocked ? '#4be0c0' : '#1a2c3a');

    ctx.fillStyle = isUnlocked ? '#eaf6ff' : '#5a7a8a';
    ctx.font = 'bold 14px "PingFang SC", sans-serif';
    ctx.fillText(n.name, nx + 15, ny + 18);

    ctx.fillStyle = isUnlocked ? '#4be0c0' : '#4a6a7a';
    ctx.font = '12px "PingFang SC", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(n.rank, nx + colW - 15, ny + 18);
    ctx.textAlign = 'left';
  });

  // 页脚与免责声明
  ctx.fillStyle = 'rgba(90, 140, 175, 0.4)'; ctx.font = '12px "PingFang SC", sans-serif';
  ctx.fillText('CHARACTER ILLUSTRATION TECH TREE ·  技术支持 Deepseek', 50, H - 80);
  
  ctx.fillStyle = 'rgba(248, 113, 113, 0.6)'; ctx.font = '11px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('⚠️ 本评测结果由用户自行点亮生成，仅供娱乐参考，不代表任何专业机构评估结果，请理性看待。', W / 2, H - 55);

  const now = new Date();
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(90, 140, 175, 0.4)';
  ctx.fillText(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`, W - 50, H - 80);

  const a = document.createElement('a');
  a.download = `评定卡_${b.name}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

  setTimeout(() => {
    const PAD = 40, HEADER = 320, FOOTER = 120; // 加高头部和底部
    const TREE_W = 1050, TREE_H = 1900;
    const W = TREE_W + PAD * 2;
    const H = HEADER + TREE_H + FOOTER + PAD;
    const SCALE = 2;

    const canvas = document.createElement('canvas');
    canvas.width = W * SCALE; canvas.height = H * SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);

    ctx.fillStyle = '#04070c'; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
    g.addColorStop(0, 'rgba(20, 50, 80, 0.3)'); g.addColorStop(1, 'rgba(4, 7, 12, 0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(40, 80, 120, 0.05)'; ctx.lineWidth = 1;
    for(let i=0; i<W; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
    for(let i=0; i<H; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }

    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#dfeef8'; ctx.font = 'bold 24px "PingFang SC", sans-serif';
    ctx.fillText('二次元角色插画 · 科技树全景', PAD, 40);
    
    const idx = getOverallRankIndex();
    const r = RANKS[idx];
    ctx.fillStyle = r.color; ctx.font = 'bold 18px "PingFang SC", sans-serif';
    ctx.fillText(`当前综合评定：${r.title}`, PAD, 75);
    
    ctx.fillStyle = '#5a7a8a'; ctx.font = '12px "PingFang SC", sans-serif';
    ctx.fillText('技术支持：DeepSeek', PAD + 350, 100);

    const startX = PAD, startY = 130;
    const bKeys = Object.keys(BRANCHES);
    const boxW = (W - PAD*2) / 7 - 10;
    const boxH = 40;
    
    bKeys.forEach((k, i) => {
      const bx = startX + i * (boxW + 10);
      drawTechFrame(ctx, bx, startY, boxW, boxH, 1, 'rgba(10,18,26,0.8)', 'rgba(40,80,120,0.3)');
      ctx.textAlign = 'center';
      ctx.fillStyle = BRANCHES[k].color; ctx.font = 'bold 12px "PingFang SC", sans-serif';
      ctx.fillText(`${BRANCHES[k].name}`, bx + boxW/2, startY + 14);
      ctx.fillStyle = '#b0c8d8'; ctx.font = '12px "PingFang SC", sans-serif';
      ctx.fillText(getBranchMaxRank(k), bx + boxW/2, startY + 30);
    });

    // 评语区
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#e0a63c'; ctx.font = '14px "PingFang SC", sans-serif';
    ctx.fillText('【当前瓶颈提示】', PAD, 190);
    ctx.fillStyle = '#b0c8d8'; ctx.font = '13px "PingFang SC", sans-serif';
    wrapText(ctx, r.desc, PAD, 215, W - PAD*2, 20);

    const TX = PAD - 20, TY = HEADER + 20;
    
    NODES.forEach(n => {
      n.prereq.forEach(pid => {
        const a = MAP[pid];
        if (!a) return;
        const ax = TX + a.x + NW; const ay = TY + a.y + NH/2;
        const bx = TX + n.x; const by = TY + n.y + NH/2;
        
        ctx.beginPath();
        if (bx <= ax) {
          const offsetX = TX + a.x - 30;
          ctx.moveTo(ax, ay); ctx.lineTo(offsetX, ay); ctx.lineTo(offsetX, by); ctx.lineTo(bx, by);
        } else {
          const midX = ax + (bx - ax) / 2;
          ctx.moveTo(ax, ay); ctx.lineTo(midX, ay); ctx.lineTo(midX, by); ctx.lineTo(bx, by);
        }
        
        if (unlocked.has(n.id)) { ctx.strokeStyle = '#4be0c0'; ctx.lineWidth = 2; ctx.setLineDash([]); }
        else if (unlocked.has(a.id)) { ctx.strokeStyle = '#4a7a9a'; ctx.lineWidth = 2; ctx.setLineDash([4,4]); }
        else { ctx.strokeStyle = '#1a2c3a'; ctx.lineWidth = 2; ctx.setLineDash([]); }
        ctx.stroke();
        ctx.setLineDash([]);
      });
    });

    NODES.forEach(n => {
      const nx = TX + n.x, ny = TY + n.y;
      const st = stateOf(n);
      
      let bg = '#0d1822', border = '#1e3a4c';
      if (st === 'unlocked') { bg = '#0f1e24'; border = '#4be0c0'; }
      else if (st === 'available') { border = '#e0a63c'; }
      else { ctx.globalAlpha = 0.4; }

      drawTechFrame(ctx, nx, ny, NW, NH, 1.5, bg, border);
      
      ctx.fillStyle = border;
      ctx.fillRect(nx + 12, ny, NW - 24, 2);

      ctx.textAlign = 'center';
      ctx.fillStyle = st === 'unlocked' ? '#eaf6ff' : '#c0d8e8';
      ctx.font = 'bold 12px "PingFang SC", sans-serif';
      ctx.fillText(n.name, nx + NW/2, ny + 22);
      
      ctx.fillStyle = st === 'unlocked' ? '#4be0c0' : (st === 'available' ? '#e0a63c' : '#5a8a9a');
      ctx.font = '11px "PingFang SC", sans-serif';
      ctx.fillText(n.rank, nx + NW/2, ny + 42);

      ctx.globalAlpha = 1.0;
    });

    // 底部信息与免责声明
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(90, 140, 175, 0.4)'; ctx.font = '14px "PingFang SC", sans-serif';
    ctx.fillText('CHARACTER ILLUSTRATION TECH TREE', PAD, H - 80);
    
    const now = new Date();
    ctx.textAlign = 'right';
    ctx.fillText(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`, W - PAD, H - 80);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(248, 113, 113, 0.6)'; ctx.font = '12px "PingFang SC", sans-serif';
    ctx.fillText('⚠️ 免责声明：本测试结果完全由用户自行点亮节点决定，仅供娱乐参考，不做任何专业美术评估及责任担保。', W / 2, H - 45);

    const a = document.createElement('a');
    a.download = `插画科技树_全景评级.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();

    btn.textContent = '导出全景评级图'; btn.disabled = false;
  }, 100);
}

document.getElementById('exportBtn').onclick = generateTreeImage;

document.getElementById('resetBtn').onclick = () => {
  if (confirm('确定要清空所有进度，重新开始吗？')) {
    unlocked.clear();
    saveProgress();
    currentView = 'overall';
    selectedBranch = 'T';
    render(); 
    updateOverallUI();
    renderDetail();
  }
};

// 初始化
updateOverallUI();
render();
renderDetail();
</script>
</body>
